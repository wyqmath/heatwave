data_processing:
  input_file: "../data/raw/paper.txt"
  kg_output_dir: "../data/processed/kg/"
  holdout_output_dir: "../data/processed/holdout/"
  batch_size: 50
  max_workers: 15

knowledge_graph:
  json_dir: "../data/processed/kg/"

node_grouping:
  similarity_threshold: 0.2
  batch_size: 500
  max_workers: 30
  use_gpu_index: false
  search_k: 500
  search_batch_size: 1000
  ivf_nprobe: 50
  min_group_size: 2
  max_groups_display: -1

llm:
  max_tokens: 8192
  temperature: 0.1
  max_retries: 3
  timeout: 120
  use_structured_output: true
  structured_output_stages: ["relation_extraction", "qa_generation", "node_mapping", "evaluation"]
  requests_per_minute: 1800
  concurrent_requests: 10

node_recommender:
  embedding_model: "text-embedding-v4"
  embedding_dimension: 1024
  top_k: 5
  similarity_threshold: 0.3
  cache_embeddings: true
  embeddings_file: "embeddings.npy"
  faiss_index_file: "embeddings.npy.faiss"

compute:
  embedding_batch_size: 10

qa_engine:
  nodes_csv_path: "all_nodes.csv"

files:
  output_relation_nodes: "output_relation_nodes.csv"
  cleaned_nodes: "cleaned_nodes.csv"
  mapping_csv: "mapping.csv"
